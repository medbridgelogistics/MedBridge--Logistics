<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shipment Tracking | MedBridge Logistics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body data-page="tracking">
    <header class="site-header">
      <div class="container nav-shell">
        <a class="brand" href="index.html">
          <img src="assets/images/medbridge-logo.svg" alt="MedBridge Logistics logo" />
          <span>MedBridge Logistics</span>
        </a>
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="services.html">Services</a>
          <a class="active" href="tracking.html">Tracking</a>
          <a href="contact.html">Contact</a>
          <a href="admin-login.html" class="nav-cta">Admin</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow">Shipment visibility</p>
          <h1>Track your shipment securely using your assigned tracking code.</h1>
        </div>
      </section>

      <section class="section">
        <div class="container tracking-shell">
          <div class="tracking-card">
            <h2>Enter your tracking code</h2>
            <form id="tracking-form" class="track-form">
              <label class="sr-only" for="tracking-code">Tracking code</label>
              <input id="tracking-code" name="tracking-code" placeholder="Enter tracking code" />
              <button class="btn btn-primary" type="submit">Find Shipment</button>
            </form>
            <div id="tracking-result" class="tracking-result" aria-live="polite"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-shell">
        <p>© 2009-2026 MedBridge Logistics. Premium medical logistics, built for healthcare.</p>
        <a href="admin-login.html">Dashboard Access</a>
      </div>
    </footer>

    <script src="assets/js/main.js"></script>
  </body>
</html>
